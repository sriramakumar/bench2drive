[project]
name = "bench2drive"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dictor>=0.1.12",
    "ephem>=4.2.1",
    "matplotlib>=3.6.1",
    "networkx>=3.2.1",
    "numpy>=1.23.5",
    "opencv-python>=4.8.1.78",
    "pexpect>=4.9.0",
    "psutil>=7.2.2",
    "py-trees==0.8.3",
    "pygame>=2.6.1",
    "requests>=2.32.5",
    "setuptools<81",
    "shapely>=2.0.7",
    "simple-watchdog-timer>=0.1.1",
    "six>=1.17.0",
    "tabulate>=0.9.0",
    "transforms3d>=0.4.2",
    "xmlschema>=4.2.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["leaderboard", "scenario_runner"]
include = ["leaderboard*", "srunner*"]
